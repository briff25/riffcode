<!-- Set the theme before first paint so there is no flash of the wrong one. -->
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("br-theme"); } catch (e) {}
    var system = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", saved || system);
  })();
</script>
</head>

<body>
<a class="skip" href="#grid">Skip to projects</a>

<div class="wrap">

  <header class="site-head">
    <div>
      <h1 class="wordmark">Riff Code</h1>
      <p class="tagline">Things I vibe coded. All of them are live — click anything.</p>
    </div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode">
      <span class="sun" aria-hidden="true">&#9728;&#65039;</span>
      <span class="moon" aria-hidden="true">&#127769;</span>
    </button>
  </header>

  <!-- Hero: whichever project has featured:true in projects.js -->
  <section id="hero" aria-label="Featured project"></section>

</div>

<div id="controls" class="controls">
  <div class="wrap controls-row">
    <div class="search">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
      </svg>
      <label class="skip" for="search">Search projects</label>
      <input id="search" type="search" placeholder="Search projects&hellip;" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div id="chips" class="chips" role="group" aria-label="Filter by tag"></div>
    <p id="count" class="count"></p>
  </div>
</div>

<div class="wrap">
  <ul id="grid" class="grid"></ul>

  <p id="empty" class="empty" hidden>
    <strong>Nothing matches that.</strong>
    Try a different word, or clear the filters.
  </p>

  <footer class="site-foot">
    <span>&copy; <span id="year">2026</span> Brian Riffle</span>
    <span>Built with Claude Code, one weekend at a time.</span>
  </footer>
</div>

<script src="projects.js?v=20260928"></script>

<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
